<body data-method="cfop">
  <header class="topbar">
    <a href="#top" class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span>rubik<b>solver</b></span>
    </a>
    <nav class="steps-nav" id="stepsNav" aria-label="Steps"></nav>
    <nav class="method" aria-label="Method">
      <a href="./" data-i18n="methodBeginner">Beginner</a><a href="cfop.html" class="on" aria-current="page" data-i18n="methodCfop">CFOP</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
  </header>

  <main id="top">
    <section class="hero hero-cfop">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="cfopHeroEyebrow">3×3 · CFOP · Intermediate</p>
        <h1 data-i18n-html="cfopHeroTitle">Same cube,<br><em>half the moves</em>.</h1>
        <p class="lead" data-i18n="cfopHeroLead">CFOP is the method most speedcubers use.</p>
        <div class="hero-actions">
          <a href="#cfop-intro" class="btn btn-primary" data-i18n="cfopHeroCta"></a>
          <a href="./" class="btn btn-ghost" data-i18n="cfopHeroBack"></a>
        </div>
        <ul class="hero-stats">
          <li><b>16</b><span data-i18n="cfopStatAlgs"></span></li>
          <li><b>~65</b><span data-i18n="cfopStatMoves"></span></li>
          <li><b>&lt;1 min</b><span data-i18n="cfopStatTime"></span></li>
        </ul>
      </div>
      <div class="hero-cube">
        <div class="halo"></div>
        <div class="cube-stage" id="heroCube"></div>
        <p class="hint" data-i18n="cfopHeroHint"></p>
      </div>
    </section>

    <section class="section" id="cfop-intro">
      <div class="section-head">
        <span class="step-num">00</span>
        <div>
          <p class="eyebrow" data-i18n="cfopIntroEyebrow"></p>
          <h2 data-i18n="cfopIntroTitle"></h2>
        </div>
      </div>
      <p class="intro-lead" data-i18n-html="cfopIntroBody"></p>
      <div class="cfop-letters">
        <div class="letter-card"><span>C</span><b>Cross</b><p data-i18n="cfopC"></p></div>
        <div class="letter-card"><span>F</span><b>F2L</b><p data-i18n="cfopF"></p></div>
        <div class="letter-card"><span>O</span><b>OLL</b><p data-i18n="cfopO"></p></div>
        <div class="letter-card"><span>P</span><b>PLL</b><p data-i18n="cfopP"></p></div>
      </div>
      <div class="notation-grid notation" id="notation">
        <div class="notation-copy">
          <div class="card compare">
            <h3 data-i18n="compareTitle"></h3>
            <table id="compare"></table>
          </div>
          <h3 data-i18n="cfopPadTitle"></h3>
          <p data-i18n-html="cfopPadBody"></p>
        </div>
        <div class="card player">
          <div class="cube-stage" id="padCube"></div>
          <div class="move-pad" id="movePad" data-keys="r l f u M x y"></div>
          <div class="pad-actions">
            <button class="btn btn-small" id="padScramble" data-i18n="scramble"></button>
            <button class="btn btn-small btn-ghost" id="padReset" data-i18n="reset"></button>
            <span class="pad-history" id="padHistory"></span>
          </div>
        </div>
      </div>
    </section>

    <div id="steps"></div>

    <section class="section finale" id="finale">
      <div class="finale-inner">
        <div class="cube-stage" id="finaleCube"></div>
        <div>
          <p class="eyebrow" data-i18n="cfopFinaleEyebrow"></p>
          <h2 data-i18n="cfopFinaleTitle"></h2>
          <p class="lead" data-i18n="cfopFinaleBody"></p>
          <div class="cheatsheet" id="cheatsheet"></div>
          <a href="#top" class="btn btn-ghost" data-i18n="backTop"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n-html="footer"></p>
  </footer>

  <template id="stepTpl">
    <section class="section step">
      <div class="section-head">
        <span class="step-num"></span>
        <div>
          <p class="eyebrow"></p>
          <h2></h2>
          <p class="tagline"></p>
        </div>
      </div>
      <div class="step-grid">
        <div class="step-copy">
          <p class="body"></p>
          <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><p></p></div>
          <label class="done-toggle"><input type="checkbox" /><span></span></label>
        </div>
        <div class="card player">
          <div class="case-tabs" role="tablist"></div>
          <p class="case-hint" hidden></p>
          <div class="stage-wrap">
            <div class="cube-stage"></div>
            <button class="focus-toggle" aria-pressed="true"></button>
            <span class="drag-chip"></span>
          </div>
          <div class="progress"><span></span></div>
          <div class="alg"></div>
          <div class="controls">
            <button class="ctl" data-act="reset" aria-label="Reset">⟲</button>
            <button class="ctl" data-act="prev" aria-label="Previous move">‹</button>
            <button class="ctl ctl-play" data-act="play" aria-label="Play">▶</button>
            <button class="ctl" data-act="next" aria-label="Next move">›</button>
            <div class="speed" role="group" aria-label="Speed">
              <button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
