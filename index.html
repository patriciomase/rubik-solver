<body data-method="beginner">
  <header class="topbar">
    <a href="#top" class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span>rubik<b>solver</b></span>
    </a>
    <nav class="steps-nav" id="stepsNav" aria-label="Steps"></nav>
    <nav class="method" aria-label="Method">
      <a href="./" class="on" aria-current="page" data-i18n="methodBeginner">Beginner</a><a href="cfop.html" data-i18n="methodCfop">CFOP</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="heroEyebrow">3×3 · Beginner method</p>
        <h1 data-i18n-html="heroTitle">Solve the cube,<br><em>one layer</em> at a time.</h1>
        <p class="lead" data-i18n="heroLead">Seven short steps, each with a live 3D cube that shows you exactly which moves to make. Drag it, slow it down, step through it move by move.</p>
        <div class="hero-actions">
          <a href="#notation" class="btn btn-primary" data-i18n="heroCta"></a>
          <a href="#step-cross" class="btn btn-ghost" data-i18n="heroSkip"></a>
        </div>
        <ul class="hero-stats">
          <li><b>7</b><span data-i18n="statSteps"></span></li>
          <li><b>7</b><span data-i18n="statAlgs"></span></li>
          <li><b>~1h</b><span data-i18n="statTime"></span></li>
        </ul>
      </div>
      <div class="hero-cube">
        <div class="halo"></div>
        <div class="cube-stage" id="heroCube"></div>
        <p class="hint" data-i18n="dragHint"></p>
      </div>
    </section>

    <section class="section notation" id="notation">
      <div class="section-head">
        <span class="step-num">00</span>
        <div>
          <p class="eyebrow" data-i18n="notationEyebrow"></p>
          <h2 data-i18n="notationTitle"></h2>
        </div>
      </div>
      <div class="notation-grid">
        <div class="notation-copy">
          <p data-i18n-html="notationBody"></p>
          <ul class="face-legend" id="faceLegend"></ul>
          <p class="small" data-i18n-html="notationKeys"></p>
        </div>
        <div class="card player">
          <div class="cube-stage" id="padCube"></div>
          <div class="move-pad" id="movePad"></div>
          <div class="pad-actions">
            <button class="btn btn-small" id="padScramble" data-i18n="scramble"></button>
            <button class="btn btn-small btn-ghost" id="padReset" data-i18n="reset"></button>
            <span class="pad-history" id="padHistory"></span>
          </div>
        </div>
      </div>
    </section>

    <div id="steps"></div>

    <section class="section finale" id="finale">
      <div class="finale-inner">
        <div class="cube-stage" id="finaleCube"></div>
        <div>
          <p class="eyebrow" data-i18n="finaleEyebrow"></p>
          <h2 data-i18n="finaleTitle"></h2>
          <p class="lead" data-i18n="finaleBody"></p>
          <div class="cheatsheet" id="cheatsheet"></div>
          <a href="#top" class="btn btn-ghost" data-i18n="backTop"></a>
        </div>
      </div>
      <a class="next-level" href="cfop.html">
        <span class="next-letters" aria-hidden="true"><i>C</i><i>F</i><i>O</i><i>P</i></span>
        <span class="next-copy"><b data-i18n="nextLevelTitle"></b><span data-i18n="nextLevelBody"></span></span>
        <span class="btn btn-primary" data-i18n="nextLevelCta"></span>
      </a>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n-html="footer"></p>
  </footer>

  <template id="stepTpl">
    <section class="section step">
      <div class="section-head">
        <span class="step-num"></span>
        <div>
          <p class="eyebrow"></p>
          <h2></h2>
          <p class="tagline"></p>
        </div>
      </div>
      <div class="step-grid">
        <div class="step-copy">
          <p class="body"></p>
          <div class="tip"><span class="tip-icon" aria-hidden="true">💡</span><p></p></div>
          <label class="done-toggle"><input type="checkbox" /><span></span></label>
        </div>
        <div class="card player">
          <div class="case-tabs" role="tablist"></div>
          <p class="case-hint" hidden></p>
          <div class="stage-wrap">
            <div class="cube-stage"></div>
            <button class="focus-toggle" aria-pressed="true"></button>
            <span class="drag-chip"></span>
          </div>
          <div class="progress"><span></span></div>
          <div class="alg"></div>
          <div class="controls">
            <button class="ctl" data-act="reset" aria-label="Reset">⟲</button>
            <button class="ctl" data-act="prev" aria-label="Previous move">‹</button>
            <button class="ctl ctl-play" data-act="play" aria-label="Play">▶</button>
            <button class="ctl" data-act="next" aria-label="Next move">›</button>
            <div class="speed" role="group" aria-label="Speed">
              <button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
